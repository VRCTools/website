- id: common
  name: Common Library
  short: VRCTCommon
  tag: VRCTCommon
  vpm_id: io.vrctools.common
  version: 0.3.1
  repo: https://github.com/VRCTools/VRCTCommon
  source_root: https://github.com/VRCTools/VRCTCommon/blob/main/Packages/io.vrctools.common/
